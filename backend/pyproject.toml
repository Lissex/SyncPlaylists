[project]
name = "syncplaylists"
version = "0.1.0"
description = "Сервис переноса плейлистов между музыкальными площадками"
readme = "README.md"
authors = [
    { name = "Grachya Ayvazyan", email = "ayvazyanhrachya54@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "dishka>=1.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "arq>=0.26",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "testcontainers[postgres]>=4.8",
    "import-linter>=2.1",
    "pre-commit>=4.0",
]

[build-system]
requires = ["uv_build>=0.9.28,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "SIM", "TID", "N", "C4", "PT", "RUF",
]
ignore = [
    # Комментарии и докстринги на русском — кириллица закономерно похожа на латиницу.
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["syncplaylists"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "arq.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.importlinter]
root_package = "syncplaylists"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain purity — no frameworks"
type = "forbidden"
source_modules = [
    "syncplaylists.shared_kernel.domain",
    "syncplaylists.modules.identity.domain",
    "syncplaylists.modules.accounts.domain",
    "syncplaylists.modules.catalog.domain",
    "syncplaylists.modules.matching.domain",
    "syncplaylists.modules.recognition.domain",
    "syncplaylists.modules.transfers.domain",
    "syncplaylists.modules.enrichment.domain",
    "syncplaylists.modules.library_tools.domain",
    "syncplaylists.modules.backups.domain",
]
forbidden_modules = [
    "fastapi", "starlette", "sqlalchemy", "redis", "httpx", "dishka",
    "arq", "pydantic_settings", "authlib", "boto3", "aioboto3",
]

