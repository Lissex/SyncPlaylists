repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --project backend mypy src
        language: system
        pass_filenames: false
        files: ^backend/src/
      - id: lint-imports
        name: import-linter
        entry: uv run --project backend lint-imports
        language: system
        pass_filenames: false
        files: ^backend/
