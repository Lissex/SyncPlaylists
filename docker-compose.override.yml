# Dev-оверрайд — docker compose подхватывает этот файл автоматически, без флагов.
# Сокет Docker и dev-таргет сюда, а не в docker-compose.yml: прод-образ/прод-команды
# не должны знать про тестовую обвязку.
services:
  api:
    build:
      target: dev
    # Сокет Docker. Интеграционные тесты (testcontainers) запускаются С ХОСТА:
    # `make test-integration`. Изнутри api они не работают даже с "--user root":
    # testcontainers ходит к соседним контейнерам (Ryuk, Redis, Postgres) через порты
    # хоста, а из контейнера они недоступны — Connection refused (проверено 2026-10-07).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worker:
    build:
      target: dev
