# Подключается в каждом location: nginx не наследует add_header уровня server в location,
# где есть свои add_header. Обложки треков — с CDN площадок (https), остальное — свой origin.
add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
